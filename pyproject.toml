[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-solver"
version = "0.1.0"
description = "AI-powered visual explanation generator for math problems"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "litellm>=1.60",
    "pillow",
    "httpx",
    "openai>=1.61",
    "tiktoken",
    "requests",
    "pydantic>=2.0",
]

[project.optional-dependencies]
full = [
    "manim>=0.18",
    "manim-voiceover>=0.3",
    "chromadb>=0.6",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langfuse>=2.58",
    "kokoro-onnx",
    "soundfile",
    "opencv-python>=4.11",
    "moviepy>=2.1",
    "cairosvg",
    "pylatexenc>=2.10",
    "ffmpeg-python>=0.2",
]
eval = [
    "scipy>=1.14",
    "numpy>=2.2",
    "statsmodels>=0.14",
    "krippendorff>=0.8",
]

[tool.setuptools.packages.find]
include = ["visual_solver*"]

[tool.setuptools.package-data]
visual_solver = [
    "src/utils/allowed_models.json",
    "task_generator/prompts_raw/*.py",
]
